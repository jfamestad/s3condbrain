[project]
name = "wiki-substrate"
version = "0.1.0"
description = "Permissioned, versioned markdown tree served as a remote MCP server."
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.35",
    "pydantic>=2.9",
    "PyJWT[crypto]>=2.9",
    "cryptography>=43",
    "PyYAML>=6.0",
    "aws-lambda-powertools>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-mock>=3.14",
    "moto[s3,dynamodb,sts]>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "boto3-stubs[s3,dynamodb,sts]>=1.35",
    "httpx>=0.27",
]
infra = [
    "aws-cdk-lib>=2.170",
    "constructs>=10.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
default-groups = ["dev", "infra"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "security: integration checks against a deployed dev instance (need WIKI_BASE_URL)",
    "aws: needs real AWS credentials (STS/S3 negative tests)",
]
addopts = "-q -m 'not security and not aws'"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = false
ignore_missing_imports = true
